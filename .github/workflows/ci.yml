name: PocketShield CI

on:
  push:
    branches: [main, 'fix/**', 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit and regression tests
        run: npm test
      - name: Validate static production bundle
        run: npm run build
